<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Form Page</title>
       <style>
    body {
        font-family: Arial, sans-serif;
        background: url("background.jpg") no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    form {
        background: rgba(0, 0, 0, 0.75); /* transparent black */
        padding: 20px;
        width: 320px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        color: white;
    }

    h2 {
        text-align: center;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input, button {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: none;
    }

    button {
        margin-top: 15px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }
</style>
 <script>
alert("JS LOADED");

document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    alert("FORM SUBMITTED");

    window.location.href = "dashboard.html";
});

</script>


</head>
<body>

<form id="loginForm">
    <h2>Welcome to Terraa</h2>

    <label>Username</label>
    <input type="text" id="name" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <!-- IMPORTANT: type="button" -->
    <button type="button" id="loginBtn">Login</button>
</form>

</body>
</html>
