<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Form Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background: black
            padding: 20px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<form>
    <h2>wellcome to Terraa</h2>

    <!-- Text Input -->
    <label for="name">username </label>
    <input type="text" id="name" name="username" placeholder="Enter your username" required>

    <!-- Email Input -->
    <label for="email">Password</label>
    <input type="email" id="email" name="password" placeholder="Enter your password" required>

    <!-- Selection (Dropdown) -->
    

    <!-- Submit Button -->
    <button type="submit">Submit</button>
</form>

</body>
</html>
